# Claude Code as a collaborator: mention @claude in an issue or a PR comment and it makes the
# change on a `claude/` branch and answers in the thread. For an issue, the action only pushes the
# branch, so the last step opens the pull request with its report and starts the preview email.
# The site's standing rules are in AGENTS.md at the repo root. Installed by the site-edit skill.
name: Claude

on:
  issues:
    types: [opened, assigned]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    # Only run when the trigger phrase is present; the action checks it too, this saves the runner.
    if: |
      (github.event_name == 'issues' && contains(github.event.issue.body, '@claude')) ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      # SITE-EDIT: the project's runtime and dependencies, so the agent can run the project's
      # checks. Replace with what the project uses (package manager, Node version, directory).
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Lets the action read CI results on the PR it is working on.
          additional_permissions: |
            actions: read
          # SITE-EDIT: allow the project's check command ("Bash(pnpm:*)" for pnpm, and so on).
          claude_args: |
            --allowedTools "Bash(npm:*)"
            --max-turns 40

      - name: Open the pull request and start the preview email
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          # Through the API, not git: the action replaces the checkout's git credentials and
          # removes them when it is done, so git cannot reach GitHub from here.
          branch=$(gh api "repos/${GITHUB_REPOSITORY}/branches?per_page=100" --jq "[.[].name | select(startswith(\"claude/issue-${ISSUE}-\"))] | sort | last // empty")
          if [ -z "$branch" ]; then echo "No branch was pushed for #${ISSUE}; nothing to open."; exit 0; fi
          if [ -n "$(gh pr list --head "$branch" --state open --json number --jq '.[0].number // empty')" ]; then echo "A pull request for $branch is already open."; exit 0; fi
          ahead=$(gh api "repos/${GITHUB_REPOSITORY}/compare/${BASE}...${branch}" --jq '.ahead_by')
          if [ "$ahead" = "0" ]; then echo "$branch has no commits beyond ${BASE}; nothing to open."; exit 0; fi
          title=$(gh issue view "$ISSUE" --json title --jq '.title' | sed 's/^Site: //')
          # The agent's final report (its comment on the issue) becomes the PR description.
          gh api "repos/${GITHUB_REPOSITORY}/issues/${ISSUE}/comments" --jq '[.[] | select(.user.login == "claude[bot]")] | last | .body // ""' > body.md
          printf '\n\nCloses #%s\n' "$ISSUE" >> body.md
          url=$(gh pr create --base "$BASE" --head "$branch" --title "$title" --body-file body.md)
          echo "Opened $url"
          gh workflow run preview-email.yml -f pr="${url##*/}"
